<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#080808" />

    <!-- Primary SEO -->
    <title>SNA Technologies | Software, Automation & Digital Solutions</title>

    <meta
      name="description"
      content="SNA Technologies builds modern software, automation, AI, cloud, DevOps and quality engineering solutions that help businesses work smarter and scale with confidence."
    />

    <meta
      name="keywords"
      content="SNA Technologies, software development, custom software, web applications, mobile applications, AI automation, cloud, DevOps, QA automation, software company Pakistan"
    />

    <meta name="author" content="SNA Technologies" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://sna-technologies.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="SNA Technologies | Technology That Moves Businesses Forward"
    />

    <meta
      property="og:description"
      content="Modern software, automation and digital solutions for businesses."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://sna-technologies.com/"
    />

    <meta
      property="og:site_name"
      content="SNA Technologies"
    />

    <meta property="og:locale" content="en_US" />

    <!-- Temporary Social Preview Image -->
    <meta
      property="og:image"
      content="https://sna-technologies.com/sna-logo-dark.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="SNA Technologies | Technology That Moves Businesses Forward"
    />

    <meta
      name="twitter:description"
      content="Modern software, automation and digital solutions for businesses."
    />

    <meta
      name="twitter:image"
      content="https://sna-technologies.com/sna-logo-dark.png"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/sna-favicon-16.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/sna-favicon-32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/sna-favicon-512.png"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SNA Technologies",
        "url": "https://sna-technologies.com/",
        "logo": "https://sna-technologies.com/sna-logo-dark.png",
        "description": "SNA Technologies builds modern software, automation, AI, cloud, DevOps and quality engineering solutions that help businesses work smarter and scale with confidence."
      }
    </script>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
